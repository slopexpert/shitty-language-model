[project]
name = "shitty-language-model"
version = "0.1.0"
description = "A tiny tokenizer, Markov models, and transformer trained on small corpora"
authors = [
    { name = "Simone Tesini", email = "simone.tesini.ext@wuerth-it.com" }
]
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.2",
    "torch>=2.13.0",
]

[project.scripts]
slm = "shitty_language_model:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
